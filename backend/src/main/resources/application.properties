spring.application.name=travel-backend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
push.enabled=${PUSH_ENABLED:false}
push.firebase-project-id=${FIREBASE_PROJECT_ID:}
push.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
